# Where your existing Kafka broker lives
bootstrap.servers=localhost:9092

# Connect worker identity
group.id=f1-analytics-connect-cluster

# Converters for internal Connect data (not your topic data — that's set per-connector)
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false

# Where Connect stores its own offset/config state (standalone mode uses local files)
offset.storage.file.filename=/tmp/connect.offsets
offset.flush.interval.ms=10000

# Where to look for connector plugins (e.g., the Snowflake sink JAR)
plugin.path=/usr/local/share/kafka/plugins

# REST API for submitting connector configs
listeners=HTTP://localhost:8083